name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^const CARD_VERSION = \".*\";/const CARD_VERSION = \"${VERSION}\";/" dist/sungrow-energy-flow-card.js
          grep -n "CARD_VERSION =" dist/sungrow-energy-flow-card.js

      - name: Attach card to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sungrow-energy-flow-card.js
